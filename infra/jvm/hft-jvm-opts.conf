# ==============================================================================
# JVM Production Configuration Profile (Java 21 LTS)
# Target: Ultra-Low Latency Java HFT Trading Engine
# Architecture: Zero-Allocation Steady-State, 0.0ms GC Pause, Invariant C2 JIT Inlining
# Location: infra/jvm/hft-jvm-opts.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Memory Subsystem & Garbage Collector
# ------------------------------------------------------------------------------
# Enforce Epsilon GC (The No-Op Garbage Collector).
# Because steady-state trading has strictly 0 bytes/second heap allocations,
# Epsilon GC completely disables GC pause threads, write barriers, and GC safepoints!
-XX:+UnlockExperimentalVMOptions
-XX:+UseEpsilonGC

# Pre-touch all heap pages at JVM startup to eliminate page faults on the critical path.
-XX:+AlwaysPreTouch

# Back the Java heap and code cache with 1GB or 2MB OS HugePages.
-XX:+UseLargePages
-XX:LargePageSizeInBytes=1G

# Fix heap size strictly at 16GB (no heap shrinking or dynamic expanding).
-Xms16g
-Xmx16g

# Explicitly bound off-heap direct byte buffer allocations (used by Agrona UnsafeBuffers).
-XX:MaxDirectMemorySize=16g

# ------------------------------------------------------------------------------
# 2. JVM Safepoint & Threading Jitter Elimination
# ------------------------------------------------------------------------------
# Prevent periodic safepoint bias revocations and cleanup pauses when GC is absent.
-XX:+UnlockDiagnosticVMOptions
-XX:GuaranteedSafepointInterval=0

# Disable biased locking (eliminates revoke biased lock safepoint pauses).
-XX:-UseBiasedLocking

# Disable string deduplication background scanning.
-XX:+UseStringDeduplication=false

# Avoid counted loop safepoint polling overhead in tight processing loops.
-XX:+UseCountedLoopSafepoints=false

# Bind JVM internal runtime active processor count to isolated core capacity.
-XX:ActiveProcessorCount=8

# Enable NUMA-aware memory allocations in the JVM runtime.
-XX:+UseNUMA

# ------------------------------------------------------------------------------
# 3. Just-In-Time (JIT) Compiler & Inlining Aggressiveness
# ------------------------------------------------------------------------------
# Lower compilation threshold so methods transition rapidly to C2 Tier 4 during warmup.
-XX:CompileThreshold=10000
-XX:+TieredCompilation
-XX:TieredStopAtLevel=4

# Dedicated background compiler threads (isolated from trading cores).
-XX:CICompilerCount=4

# Deep aggressive inlining parameters for flyweight accessors and ring buffer logic.
-XX:+Inline
-XX:MaxInlineLevel=15
-XX:MaxInlineSize=250
-XX:FreqInlineSize=325
-XX:InlineSmallCode=2000

# Enable aggressive loop unrolling and escape analysis.
-XX:+DoEscapeAnalysis
-XX:+LoopUnrolling
-XX:+OptimizeStringConcat

# Eliminate unneeded null-checks and range checks where proven redundant.
-XX:+TrustFinalNonStaticFields

# ------------------------------------------------------------------------------
# 4. Low-Latency Network & Standard Library Presets
# ------------------------------------------------------------------------------
# Prefer IPv4 stack to bypass IPv6 socket lookup latency.
-Djava.net.preferIPv4Stack=true

# Set deterministic charset provider.
-Dsun.net.spi.nameservice.provider.charset=ISO-8859-1

# Open internal modules for Agrona Unsafe memory access on Java 21+.
--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED
--add-opens=java.base/java.nio=ALL-UNNAMED
--add-opens=java.base/sun.nio.ch=ALL-UNNAMED

# ------------------------------------------------------------------------------
# 5. Production Flight Recorder (JFR) - Continuous Zero-Overhead Telemetry
# ------------------------------------------------------------------------------
# Flight recorder with low overhead profile for auditing latency outliers without instrumentation.
-XX:StartFlightRecording=disk=true,dumponexit=true,filename=/var/log/hft/prod_jfr.jfr,settings=profile,maxsize=4g,maxage=1d
