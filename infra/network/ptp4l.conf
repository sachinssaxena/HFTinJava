# ==============================================================================
# Linux PTP (IEEE 1588-2008 / IEEE 1588-2019) Configuration File
# Standard: MiFID II RTS 25 Regulatory Compliance for Algorithmic Trading Systems
# Target: Hardware timestamping via Solarflare PTP / PHC (Physical Hardware Clock)
# Location: /etc/linuxptp/ptp4l.conf or infra/network/ptp4l.conf
# ==============================================================================

[global]
# Logging & Verbosity
verbose                 0
logAnnounceInterval     1
logSyncInterval         -3      # 8 sync packets per second (1/8s)
logMinDelayReqInterval  -3      # 8 delay request packets per second
summary_interval        1       # Output summary statistics every 1 second

# Clock Specification & Servoing
clock_servo             pi      # Proportional-Integral servo
pi_proportional_const   0.0     # Let servo auto-calibrate
pi_integral_const       0.0
step_threshold          0.00002 # Step clock if offset exceeds 20us; otherwise slew smoothly
first_step_threshold    0.00002

# Transport & Layer Configuration
network_transport       UDPv4   # Standard Multicast PTP over IPv4
delay_mechanism         E2E     # End-to-End delay measurement mechanism
time_stamping           hardware # Strict Hardware NIC timestamping (Solarflare PHC)

# PTP Domain & Priority
domainNumber            0
priority1               128
priority2               128

# Grandmaster & Fault Tolerance
clock_type              OC      # Ordinary Clock (Slave mode)
slaveOnly               1       # Strictly act as PTP slave to Grandmaster Clock (GPS/Atomic)

# Hardware Timestamp Offsets & Adjustments
tx_timestamp_timeout    10
check_fup_sync          0

# Socket & Buffer Configuration
socket_priority         7       # High priority for PTP socket packets

# Specific Interface Config (Overrides for eth0 / onload0)
[eth0]
network_transport       UDPv4
delay_mechanism         E2E
