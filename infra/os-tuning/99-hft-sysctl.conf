# ==============================================================================
# Linux Sysctl Tuning Configuration for Ultra-Low Latency Java HFT Platform
# Target Location: /etc/sysctl.d/99-hft.conf
# Apply via: sudo sysctl -p /etc/sysctl.d/99-hft.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Virtual Memory & Paging Subsystem Tuning
# ------------------------------------------------------------------------------
# Strictly disable swapping to disk. Any page fault to swap is catastrophic for HFT.
vm.swappiness = 0

# Prevent background memory writeback stalls from blocking threads.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# Disable zone reclaim to prevent NUMA page scanning latency
vm.zone_reclaim_mode = 0

# Pre-fault and pin memory limits
vm.max_map_count = 262144

# Keep minimum free Kbytes in memory to prevent kernel allocator drops under burst
vm.min_free_kbytes = 1048576

# Disable overcommit to prevent unexpected OOM kills
vm.overcommit_memory = 1

# ------------------------------------------------------------------------------
# 2. Kernel Real-Time & Scheduler Tuning
# ------------------------------------------------------------------------------
# Allow real-time processes (SCHED_FIFO / SCHED_RR) to run with 100% CPU usage without throttling
kernel.sched_rt_runtime_us = -1

# Disable NMI watchdog periodic timer interrupts
kernel.nmi_watchdog = 0

# Disable automatic NUMA memory balancing
kernel.numa_balancing = 0

# Minimize scheduler migration cost to discourage migrating threads across cores
kernel.sched_migration_cost_ns = 5000000

# ------------------------------------------------------------------------------
# 3. Network Core & Socket Buffer Tuning
# ------------------------------------------------------------------------------
# Maximize socket receive and transmit buffer sizes (64 MB)
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 33554432
net.core.wmem_default = 33554432
net.core.optmem_max = 2097152

# Maximum number of packets queued on the input side before processing
net.core.netdev_max_backlog = 250000

# Network device budget per polling cycle
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 20000

# Enable busy polling and busy read on sockets to eliminate interrupt wakeups
# (50 microseconds socket polling timeout)
net.core.busy_read = 50
net.core.busy_poll = 50

# ------------------------------------------------------------------------------
# 4. TCP/IP Stack Low-Latency Tuning
# ------------------------------------------------------------------------------
# Set TCP read and write memory bounds: min default max (64MB max)
net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864

# Enable TCP low latency mode (gives preference to low latency over throughput)
net.ipv4.tcp_low_latency = 1

# Disable TCP timestamps to eliminate 12-byte header overhead per packet
net.ipv4.tcp_timestamps = 0

# Disable Selective Acknowledgments (SACK) to reduce TCP processing path overhead
net.ipv4.tcp_sack = 0

# Disable duplicate SACK (DSACK)
net.ipv4.tcp_dsack = 0

# Disable slow start after idle to prevent connection throttling on market inactivity
net.ipv4.tcp_slow_start_after_idle = 0

# Maximize SYN backlog queue for fast connection establishment
net.ipv4.tcp_max_syn_backlog = 3240000

# Enable TCP window scaling
net.ipv4.tcp_window_scaling = 1

# Reduce FIN timeout to free up socket descriptors rapidly
net.ipv4.tcp_fin_timeout = 15

# Disable fast recycling and metrics caching
net.ipv4.tcp_no_metrics_save = 1

# Increase system-wide file descriptor limit
fs.file-max = 2097152
