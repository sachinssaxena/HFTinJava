# ==============================================================================
# Linux Kernel Boot Parameters for Ultra-Low Latency Java HFT Engine
# Target Hardware: Dual-Socket / Multi-Core Intel Xeon Scalable or AMD EPYC
# Topology: NUMA Node 0 Cores 2-5 dedicated exclusively to Trading Pipeline
# Location: /etc/default/grub (Append to GRUB_CMDLINE_LINUX_DEFAULT)
# ==============================================================================

# 1. CPU Core Isolation & Tickless Scheduling
# - isolcpus=managed_irq,domain,nohz,2-5: Isolate cores 2, 3, 4, 5 from Linux CFS scheduler,
#   user threads, and managed IRQs.
# - nohz_full=2-5: Adaptive-ticks mode. Disables scheduler timer ticks when 1 runnable thread is active.
# - rcu_nocbs=2-5: Offloads RCU callback processing from isolated cores to housekeeping cores (0-1).
# - kthread_cpus=0-1: Directs kernel daemon threads (e.g. kworker, ksoftirqd) to cores 0-1.
# - irqaffinity=0,1: Directs all default hardware and software interrupts to cores 0-1.

# 2. Power Management & Zero-Jitter Latency Tuning
# - idle=poll: Replaces idle sleep with busy-polling loop. Eliminates 10-50us wake latency.
# - intel_idle.max_cstate=0 & processor.max_cstate=0: Restricts CPU strictly to C0 execution state.
# - intel_pstate=disable: Disables Intel dynamic frequency scaling, delegating to acpi-cpufreq.
# - nosoftlockup & nowatchdog: Disables kernel watchdog threads that generate periodic interrupts.
# - nmi_watchdog=0: Disables Non-Maskable Interrupt hardware watchdog ticks.

# 3. Hardware Architecture & Memory Subsystem
# - default_hugepagesz=1G hugepagesz=1G hugepages=16: Pre-allocates 16x 1GB HugePages at boot time
#   guaranteeing zero memory fragmentation and eliminating TLB misses for the 16GB off-heap buffer pool.
# - transparent_hugepage=never: Completely disables khugepaged background defragmentation and compaction,
#   which cause catastrophic multi-millisecond tail latency spikes.
# - numa_balancing=disable: Prevents automated kernel page migration across NUMA sockets.

# 4. Clocksource & Hardware Diagnostics
# - tsc=reliable clocksource=tsc: Enforces invariant, high-precision Time Stamp Counter as primary clock.
# - mce=ignore_ce: Suppresses Machine Check Exception handling for corrected errors (avoids SMI stalls).
# - audit=0: Disables kernel syscall audit subsystem overhead.

GRUB_CMDLINE_LINUX_DEFAULT="quiet splash \
isolcpus=managed_irq,domain,nohz,2-5 \
nohz_full=2-5 \
rcu_nocbs=2-5 \
kthread_cpus=0-1 \
irqaffinity=0,1 \
idle=poll \
intel_idle.max_cstate=0 \
processor.max_cstate=0 \
intel_pstate=disable \
nosoftlockup \
nowatchdog \
nmi_watchdog=0 \
default_hugepagesz=1G \
hugepagesz=1G \
hugepages=16 \
transparent_hugepage=never \
numa_balancing=disable \
tsc=reliable \
clocksource=tsc \
mce=ignore_ce \
audit=0"
